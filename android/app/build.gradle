plugins { id 'com.android.application' }

android {
    namespace 'sn.xelkoom.toubabazar'
    compileSdk 34
    defaultConfig {
        applicationId "sn.xelkoom.toubabazar"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
        // Adresse de la caisse sur Vercel (dossier web/ du dépôt)
        buildConfigField "String", "CAISSE_URL", '"https://touba-bazar-caisse.vercel.app/"'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'   // FileProvider (export des ventes)
}
